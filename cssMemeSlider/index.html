<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>cssMemeSlider</title>
</head>
<body>
  <div class="container">
  <section>
   <div class="cards">
    <div class="card">
      <img src="images/image_1.jpg" alt="image_1">
    </div>
    <div class="card">
      <img src="images/image_2.jpg" alt="image_2">
    </div>
    <div class="card">
      <img src="images/image_3.jpg" alt="image_3">
    </div>
    <div class="card">
      <img src="images/image_4.jpg" alt="image_4">
    </div>
   </div>
  </section> 



  
  <div class="wrapper-navigation">
    <div class="text-slider">
          <div class="text-item">
            <div class="first text-name">
              <p>Съел сосиску</p>
            </div>
            <div class="text-name">
              <p>Разбил лайфон Шарику!</p>
            </div>
            <div class="text-name">
              <p>Гадил в тапки</p>
            </div>
            <div class="text-name">
              <p>I have people</p>
            </div>
          </div>
    </div>  
    <nav>
      <input type="radio" name="s" id="s0" checked>
      <label for="s0"><img src="images/image_1.jpg"> </label>
      <input type="radio" name="s" id="s1" checked>
      <label for="s1"><img src="images/image_2.jpg"> </label>
      <input type="radio" name="s" id="s2" checked>
      <label for="s2"><img src="images/image_3.jpg"> </label>
      <input type="radio" name="s" id="s3" checked>
      <label for="s3"><img src="images/image_4.jpg"> </label>
    </nav>
  </div>
</div>
</body>
</html>
